title: Encoded PowerShell Execution
id: SIG-EXEC-001
status: stable
description: Detects PowerShell launched with encoded command flags, a common obfuscation technique.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: AutoSIEM
date: 2026/08/04
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '-enc'
      - '-encodedcommand'
      - 'IEX'
  condition: selection and not filter
  filter:
    CommandLine|contains:
      - 'AzureAD'
      - 'ModuleAnalyzer'
falsepositives:
  - Administrative scripts using encoded commands
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1027