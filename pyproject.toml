[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosiem"
version = "0.1.0"
description = "AI-ready, standards-aligned SIEM foundation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AutoSIEM" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
autosiem = "autosiem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The distilled ATT&CK Enterprise index. Without this the matrix is missing from
# an installed wheel and `cli coverage` cannot report matrix coverage.
autosiem = ["attack_enterprise_index.json"]
