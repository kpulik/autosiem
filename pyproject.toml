[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosiem"
version = "0.1.0"
description = "AI-ready, standards-aligned SIEM foundation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AutoSIEM" }]
dependencies = []

[tool.pytest.ini_options]
markers = [
    "system_one_integration: talks to a real Jev API or loads a real Laya model; excluded by default",
]
# The default suite must need no API key, no network and no model download, so
# provider integration tests are opt-in. Run them with:
#   pytest tests/test_system_one_integration.py -m system_one_integration
addopts = "-m 'not system_one_integration'"

[project.optional-dependencies]
# python-multipart is not optional for the UI: every /ui/* mutation route
# (approve, reject, toggle rule, add suppression, update incident, comment)
# calls request.form(), and Starlette raises without it. Missing here meant a
# fresh install crashed on the first dashboard button press.
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.2,<4"]
# The open-weight System One provider. Optional on purpose: it pulls torch and a
# 421M-parameter checkpoint, and a Jev-only or decision-disabled install (the
# default) must not pay for either.
laya = ["laya>=0.3.3"]

[project.scripts]
autosiem = "autosiem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The distilled ATT&CK Enterprise index. Without this the matrix is missing from
# an installed wheel and `cli coverage` cannot report matrix coverage.
autosiem = ["attack_enterprise_index.json", "migrations/*.sql"]
